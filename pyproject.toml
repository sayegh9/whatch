[project]
name = "whatch"
version = "0.1.0"
description = "A private, local-first movie and TV catalog."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.109,<1",
  "google-adk>=2.5,<2.6",
  "httpx>=0.28,<1",
  "pydantic>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
